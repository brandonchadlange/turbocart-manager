frontend:
  phases:
    preBuild:
      commands:
        - env | grep -e DATABASE_URL >> .env.production
        - env | grep -e JWT_SECRET >> .env.production
        - env | grep -e NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY >> .env.production
        - env | grep -e CLERK_SECRET_KEY >> .env.production
        - env | grep -e KNOCK_PRIVATE_API_KEY >> .env.production
        - env | grep -e NEXT_PUBLIC_KNOCK_PUBLIC_API_KEY >> .env.production
        - env | grep -e NEXT_PUBLIC_KNOCK_FEED_CHANNEL_ID >> .env.production
        - env | grep -e AMPLIFY_ACCESS_KEY >> .env.production
        - env | grep -e AMPLIFY_SECRET_KEY >> .env.production
        - yarn install
    build:
      commands:
        - yarn run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'